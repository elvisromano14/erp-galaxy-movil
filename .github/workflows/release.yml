# Release firmado (APK + AAB) para Google Play o instalación directa. Se dispara con una etiqueta `v*` (p. ej. v1.0.0) o a mano.
# Requiere estos secretos del repositorio (ver docs/LANZAMIENTO.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# El resultado queda como artefacto y como borrador de release (no se publica solo).
name: Release firmado

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      env:
        description: "Entorno (prod | staging)"
        default: prod

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: ${{ inputs.env || 'prod' }}
      VERSION_CODE: ${{ github.run_number }}
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secretos de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          for v in KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Falta el secreto para $v (ver docs/LANZAMIENTO.md)"; exit 1; }
          done
          # (el contexto `runner` no existe en `env:` de nivel de trabajo: la ruta se fija aquí y se exporta a los pasos siguientes)
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pnpm install --frozen-lockfile

      # Las pruebas deben pasar ANTES de firmar un release
      - run: pnpm check

      - name: Generar el proyecto Android y aplicar la firma
        run: |
          npx expo prebuild --platform android --no-install
          node scripts/release-signing.cjs android/app/build.gradle

      - name: Compilar APK y AAB firmados
        run: ./gradlew assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: android

      - name: Reunir resultados
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-release
          cp android/app/build/outputs/apk/release/app-release.apk "dist-release/erp-ventas-${APP_ENV}-${VERSION}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist-release/erp-ventas-${APP_ENV}-${VERSION}.aab"
          (cd dist-release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: erp-ventas-${{ env.APP_ENV }}-release
          path: dist-release/*
          if-no-files-found: error

      - name: Borrador de release en GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-release/*
          generate_release_notes: true
